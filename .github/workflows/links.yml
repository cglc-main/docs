# Broken links in the docs fail the pull request.
name: links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: lychee
        env:
          # renovate: datasource=github-releases depName=lycheeverse/lychee
          LYCHEE: 0.24.2
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          ./lychee --no-progress --exclude 'int\.bulbashenko\.com' --exclude localhost './**/*.md'
