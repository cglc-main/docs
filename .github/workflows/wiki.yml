# Push every markdown change to the GitHub Wiki on merge to main.
name: wiki

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/scripts/sync-wiki.py"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Sync to wiki
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-wiki.py /tmp/wiki
          cd /tmp/wiki
          git config user.name "cglc-auto-bot[bot]"
          git config user.email "361313835+cglc-auto-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
          else
            git commit -m "docs: sync from ${GITHUB_SHA::7}"
            git push
          fi
